<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Link da bio de Rômulo Zorzanelli com cards de oferta, contato rápido e redes sociais."
    />
    <title>Rômulo Zorzanelli | Link da Bio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --background: oklch(0.16 0.004 50);
        --foreground: oklch(0.97 0.008 60);
        --card: oklch(0.21 0.005 50);
        --primary: oklch(0.76 0.085 45);
        --primary-foreground: oklch(0.16 0.004 45);
        --cta: oklch(0.7 0.18 150);
        --cta-foreground: oklch(0.99 0.01 150);
        --muted-foreground: oklch(0.74 0.018 48);
        --border: oklch(0.34 0.028 48);
        --destructive: oklch(0.58 0.22 27);
        --radius-sm: 0.5rem;
        --radius-md: 0.625rem;
        --radius-lg: 0.75rem;
        --radius-xl: 1rem;
        --radius: 0.75rem;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at top, rgba(201, 149, 108, 0.12), transparent 30%),
          radial-gradient(circle at 70% 20%, rgba(46, 168, 77, 0.09), transparent 22%),
          var(--background);
        color: var(--foreground);
        font-family: "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      h1,
      h2,
      h3,
      h4 {
        margin: 0;
        font-family: "Montserrat", ui-sans-serif, system-ui, sans-serif;
        font-weight: 800;
        letter-spacing: -0.01em;
      }

      p {
        margin: 0;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      img {
        display: block;
        width: 100%;
      }

      .page {
        min-height: 100vh;
        padding: 26px 16px 40px;
      }

      .wrap {
        max-width: 980px;
        margin: 0 auto;
      }

      .profile {
        text-align: center;
        padding: 8px 0 22px;
      }

      .eyebrow {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--primary);
      }

      .category {
        margin-top: 6px;
        color: var(--muted-foreground);
        font-size: 15px;
        font-weight: 700;
      }

      .bio {
        margin: 14px auto 0;
        max-width: 54ch;
        color: var(--muted-foreground);
        line-height: 1.72;
        font-size: 15px;
      }

      .offer-list {
        display: grid;
        gap: 16px;
        margin-top: 20px;
        grid-template-columns: 1fr;
      }

      .offer-card {
        position: relative;
        display: block;
        height: 100%;
        border-radius: calc(var(--radius) + 8px);
        overflow: hidden;
        background: var(--card);
        border: 1px solid var(--border);
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.24);
        transition: 180ms ease;
      }

      .offer-card:hover {
        transform: translateY(-2px);
      }

      .offer-thumb {
        position: relative;
      }

      .offer-thumb img {
        aspect-ratio: 2 / 1;
        object-fit: cover;
      }

      .badge {
        position: absolute;
        top: 14px;
        right: 14px;
        z-index: 2;
        border-radius: 999px;
        padding: 8px 12px;
        background: rgba(17, 24, 39, 0.92);
        border: 1px solid rgba(201, 149, 108, 0.36);
        color: var(--primary);
        font-size: 12px;
        font-weight: 800;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.18);
      }

      .offer-body {
        padding: 16px 18px 18px;
      }

      @media (min-width: 900px) {
        .offer-list {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      .social-section {
        text-align: center;
        padding: 26px 0 8px;
      }

      .social-section h2 {
        font-size: 18px;
        line-height: 1.35;
      }

      .social-icons {
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 14px;
      }

      .social-icon {
        width: 48px;
        height: 48px;
        border-radius: 999px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: var(--card);
        border: 1px solid var(--border);
        box-shadow: 0 12px 22px rgba(0, 0, 0, 0.16);
        transition: 180ms ease;
      }

      .social-icon:hover {
        transform: translateY(-1px);
        border-color: rgba(201, 149, 108, 0.45);
      }

      .footer {
        margin-top: 16px;
        padding-top: 18px;
        border-top: 1px solid var(--border);
        text-align: center;
        color: var(--muted-foreground);
        font-size: 13px;
        line-height: 1.75;
      }

      .footer a {
        color: var(--primary);
        font-weight: 700;
      }

      @media (max-width: 520px) {
        .page {
          padding-inline: 12px;
        }

        .offer-body h2 {
          font-size: 20px;
        }
      }
    </style>
  </head>
  <body>

  </body>
</html>
